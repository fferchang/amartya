; Nodo de nivel de cisterna: ESP32-C3 SuperMini + JSN-SR04T, publicando por
; HTTP, como JSON, al servidor de API_URL.
;
; Es un PROTOTIPO probado con el sensor real, no el firmware definitivo:
;
;   - Publica la mediana de ~20 disparos cada 5 SEGUNDOS, que es un ritmo de
;     prueba (ver CICLO_MS en el .ino). El servidor tiene que aceptar 12 POST
;     por minuto.
;   - NO tiene buffer: si un envío falla, esa lectura se pierde.
;   - Habla HTTP plano. El transporte definitivo (HTTP, HTTPS o MQTT) está por
;     acordarse con UMA NET.
;
; Uso (desde esta carpeta):
;   1. copiar include/config.local.h.example a include/config.local.h y llenarlo
;   2. pio run -t upload
;   3. pio device monitor

[env:pipeline]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; SIN ESTAS DOS LÍNEAS EL MONITOR SERIE QUEDA EN BLANCO. El SuperMini no tiene
; chip USB-serie: el USB-C sale directo del C3, y sin CDC_ON_BOOT `Serial`
; apunta a la UART0 (GPIO20/21), que en esta placa no va a ningún lado. El board
; esp32-c3-devkitm-1 no trae estos flags de fábrica. USB_MODE=1 es "usar el USB
; por hardware del chip", el único que tiene el C3.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Sin lib_deps: WiFi, HTTPClient y la hora por NTP vienen con el core. El JSON
; se arma a mano con snprintf en vez de sumar ArduinoJson, porque es un solo
; objeto chato de cinco campos que se ESCRIBE y nunca se lee; una librería
; entera para eso es más código que el problema.
