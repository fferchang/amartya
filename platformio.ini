; Nodo de nivel de cisterna: ESP32-C3 SuperMini + JSN-SR04T, publicando por
; MQTT sobre TLS al broker de MQTT_HOST.
;
; Es el PROTOTIPO para el primer montaje, no el nodo definitivo:
;
;   - Alimentado por fuente y con el WiFi del lugar. Batería, panel y enlace
;     para la sierra (Starlink, LoRa...) quedan para otra iteración, así que el
;     nodo no duerme: queda conectado al broker todo el tiempo.
;   - Mide solo nivel. No tiene sensor de temperatura ni mide batería.
;   - Publica cada 1 minuto, con QoS 0 y sin retain. NO guarda lecturas: si el
;     WiFi o el broker no están, esa lectura se pierde y queda un hueco.
;
; Uso (desde esta carpeta):
;   1. copiar include/config.local.h.example a include/config.local.h y llenarlo
;   2. pio run -t upload
;   3. pio device monitor

[env:pipeline]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Tabla propia: la por defecto más una partición `buffer` de 512 KB, todavía
; sin usar. Se declara ahora porque la tabla solo se cambia por cable, no por
; OTA. El porqué de cada tamaño está en el mismo archivo.
board_build.partitions = partitions.csv

; SIN ESTAS DOS LÍNEAS EL MONITOR SERIE QUEDA EN BLANCO. El SuperMini no tiene
; chip USB-serie: el USB-C sale directo del C3, y sin CDC_ON_BOOT `Serial`
; apunta a la UART0 (GPIO20/21), que en esta placa no va a ningún lado. El board
; esp32-c3-devkitm-1 no trae estos flags de fábrica. USB_MODE=1 es "usar el USB
; por hardware del chip", el único que tiene el C3.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; PubSubClient porque el core del ESP32 no trae cliente MQTT, y es el estándar
; de Arduino: chico, sin dependencias, y cualquier error tiene mil respuestas en
; foros. Alcanza porque el nodo solo PUBLICA con QoS 0, que es lo único que hace
; bien (no publica con QoS 1 ni 2). El TLS lo pone WiFiClientSecure, del core.
; El JSON se sigue armando a mano con snprintf: es un objeto chato de cuatro
; campos que se escribe y nunca se lee.
lib_deps =
    knolleary/PubSubClient@^2.8
